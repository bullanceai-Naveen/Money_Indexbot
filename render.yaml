services:
  - type: web
    name: index-oi-scanner
    env: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt && python init_db.py
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/stats
    envVars:
      - key: UPSTOX_ACCESS_TOKENS
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.0